workflow: Release approval
version: 0.2.0
description: Verify a branch, get a human go/no-go, then either a final review (yes) or a rework
  note (no). Proves approval nodes, exclusive gateways, deadlines and affinity in Baton.
inputs:
  branch:
    type: text
    label: Branch to verify
    required: true
steps:
  verify:
    role: qa
    title: Verify the candidate
    do: Check out the branch named in the workflow input, run the project's test command, and register a
      test_report with suite, passed and failed counts and the commit sha. Do not modify source
      files.
    produces:
      - test_report
    budget_usd: 1
  go:
    human: operator
    title: Operator go/no-go
    do: A person decides whether the candidate may be released, based on the test report.
    after: verify
    decide:
      field: review.verdict
      outcomes:
        yes: approve
        no: request_changes
  sign:
    role: reviewer
    title: Final review
    do: "Read the test_report and the approval review. Write a short release review: verdict approve,
      summary of what was verified and who approved, no findings unless something is wrong."
    after: go
    when: go = yes
    produces:
      - review
    budget_usd: 1
  rework:
    role: frontend-dev
    title: Rework note
    do: "The operator rejected the candidate. Read the test_report and the operator's review (its
      summary holds the reason). Do not change code. Register a handoff artefact: a summary of what
      must change before the next candidate, concrete next steps as a list, and any caveats."
    after: go
    when: go = no
    produces:
      - handoff
    budget_usd: 1
outputs:
  - review
