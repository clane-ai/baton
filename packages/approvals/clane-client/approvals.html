<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Clane Approvals</title>
    <!-- Document-relative, NOT absolute: absolute paths ignore the <base href>
         the server injects, so `/clane-mark.svg` would 404 under both /approvals
         and /clane/approvals. These resolve against the injected base like every
         other asset in this build. -->
    <link rel="icon" type="image/svg+xml" href="./clane-mark.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#0A1224" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script>
      // Pre-paint theme so the first frame is already in the right mode. This
      // area composes from the shared src/ds, whose dark palette keys off
      // data-mode="dark" on <html> (see src/ds/tokens.css and src/approvals/theme.ts).
      (function () {
        try {
          var mode = localStorage.getItem('clane-approvals:theme');
          if (!mode || mode === 'system') {
            mode =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          if (mode === 'dark') document.documentElement.setAttribute('data-mode', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/approvals/main.tsx"></script>
  </body>
</html>
